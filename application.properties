# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:bloodbank.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=BloodBankSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# ── Email (Gmail SMTP) ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=itsvanshikarawat@gmail.com
spring.mail.password=nnutcqjngchahuqe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.mime.charset=UTF-8
# Explicit from address (avoids Illegal address errors from @Value injection)
app.mail.from=itsvanshikarawat@gmail.com

# ── Async Thread Pool ─────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.bloodbank=DEBUG
logging.level.org.springframework.mail=DEBUG

